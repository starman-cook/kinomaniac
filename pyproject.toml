[project]
name = "kinomaniac"
version = "0.1.0"
description = "Киноманьяк — подбор фильмов строго из каталога (Common + Rare + Legendary Telegram-бот)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.68.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=22.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
