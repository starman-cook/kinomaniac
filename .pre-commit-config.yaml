repos:
  - repo: local
    hooks:
      - id: forbid-env-file
        name: Forbid committing .env secrets
        entry: python -c "import sys; bad=[a for a in sys.argv[1:] if a.replace('\\\\','/').split('/')[-1]=='.env']; sys.exit('Refusing to commit .env!' if bad else 0)"
        language: system
        pass_filenames: true
      - id: ruff-check
        name: Ruff lint check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: pytest-mocked
        name: Pytest unit tests (mocked client, no API calls)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
