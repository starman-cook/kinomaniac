name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12 and install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run pytest with mocked LLM client (no API keys required)
        run: uv run pytest -v

      - name: Verify kino.py contract on import (no side effects)
        run: |
          uv run python -c "import kino; assert callable(kino.pick); print('Contract import OK')"
